; Oyster Pocket firmware - M5Stack Cardputer ADV (Stamp-S3A, ESP32-S3FN8, 8 MB flash, NO PSRAM)
; Toolchain decision: docs/adr/ADR-001-firmware-toolchain.md
; Resolved library versions, binary and partition sizes: docs/BUILD_MATRIX.md

[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = espressif32@6.13.0            ; Arduino-ESP32 2.0.17 / ESP-IDF 4.4.7
board = esp32-s3-devkitc-1               ; board recipe documented by M5Stack for the Cardputer ADV
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb_noota.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_dtr = 0                          ; native USB-Serial/JTAG: asserting DTR/RTS at open resets the chip into its bootloader
monitor_rts = 0
upload_speed = 115200                    ; native USB-Serial/JTAG ignores the UART rate; switching it stalled a flash read on the first device
test_ignore = *                          ; host tests run in env:native only
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=2
    ; The USB-C port is wired to the ESP32-S3 native USB (USB-Serial-JTAG). Serial must be the
    ; hardware CDC, otherwise output goes to UART0 pins that the ADV uses for other functions.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; ArduinoJson 7
    -DARDUINOJSON_USE_DOUBLE=0
    -DARDUINOJSON_USE_LONG_LONG=1
    ; NimBLE-Arduino 2.x: central + observer roles only, one connection (saves RAM/flash)
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=1
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=0
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=4
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=8
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=1      ; C++ wrapper: 1 = ERROR. Host-stack log level left at its default (none).
    -DOYSTER_FIRMWARE_VERSION=\"0.1.0\"
lib_deps =
    m5stack/M5Cardputer@1.1.1
    z3t0/IRremote@4.7.1                  ; transitive dep of M5Cardputer (floating "*" upstream), pinned here
    m5stack/M5Unified@0.2.27
    m5stack/M5GFX@0.2.34
    h2zero/NimBLE-Arduino@2.5.1
    bblanchon/ArduinoJson@7.4.3

; Host-side unit tests of the platform-independent core (lib/oyster_core). Needs a host GCC (see docs/SETUP_WINDOWS.md).
[env:native]
platform = native
test_framework = unity
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DOYSTER_HOST_TEST
    -Wall
    -Wextra
lib_compat_mode = off
lib_ignore = M5Cardputer, M5Unified, M5GFX, NimBLE-Arduino, ArduinoJson
