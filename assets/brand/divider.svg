  <path d="M0 30 C 100 18, 200 18, 300 30 S 500 42, 600 30 S 800 18, 900 30 S 1100 42, 1200 30" fill="none" stroke="url(#wave)" stroke-width="1" stroke-opacity="0.45" stroke-linecap="round"/>
