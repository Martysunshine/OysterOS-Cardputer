<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 44" width="1200" height="44" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B79CFF" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#B79CFF"/>
      <stop offset="0.5" stop-color="#8FC4F0"/>
      <stop offset="0.82" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </linearGradient>
    <style>
      .b { fill: none; stroke-width: 1.4; animation: rise 5s ease-in-out infinite; }
      .b2 { animation-delay: -1.6s; } .b3 { animation-delay: -3.1s; } .b4 { animation-delay: -2.3s; } .b5 { animation-delay: -4.2s; }
      @keyframes rise { 0%, 100% { transform: translateY(3px); opacity: 0.35; } 50% { transform: translateY(-4px); opacity: 0.95; } }
      @media (prefers-reduced-motion: reduce) { .b { animation: none; opacity: 0.7; } }
    </style>
  </defs>
