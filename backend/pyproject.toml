[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oyster-backend"
version = "0.1.0"
description = "Oyster Pocket backend: device API, job lifecycle, AI orchestration, reports"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "cryptography>=43",
  "python-dotenv>=1.0,<2",
  "truststore>=0.10",
  "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
oyster = "oyster.cli:main"

[tool.setuptools.packages.find]
include = ["oyster*"]
